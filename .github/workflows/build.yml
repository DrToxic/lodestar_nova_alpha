name: Build LODESTAR NOVA firmware

run-name: "${{ github.event_name == 'workflow_dispatch' && format('NOVA build: {0}', inputs.env) || 'NOVA checks' }}"

# Two kinds of run:
#   * every push and pull request: unit tests, screen-layout tests, and a check that the patch
#     still applies to the current MeshCore (about a minute, no firmware build)
#   * "Run workflow" by hand: the same checks, then the full firmware build (about 5 minutes)
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Firmware type. Bluetooth keeps the USB port free for the dashboard page"
        default: heltec_v4_companion_radio_ble
        required: true
        type: choice
        options:
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_usb
          - Xiao_nrf52_companion_radio_ble
          - Xiao_nrf52_companion_radio_usb
      units:
        description: "Speed units shown by the screens and the dashboard: metric (km/h) or mph"
        default: metric
        required: true
        type: choice
        options:
          - metric
          - mph
      edition:
        description: "nova = the normal companion. orion = LODESTAR ORION, the wardriving edition (same firmware, ORION name, needs a GPS to be useful)"
        default: nova
        required: true
        type: choice
        options:
          - nova
          - orion
      publish:
        description: "Publish the result as a GitHub Release anyone can download"
        default: false
        required: false
        type: boolean
      replace_files:
        description: "Owner only: replace the files already attached to the release with this build. Leave off unless you mean it"
        default: false
        required: false
        type: boolean
      release_tag:
        description: "Release tag. Required when publishing. A new tag makes a release; an existing release with no files gets the firmware attached"
        default: ""
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test NOVA
        run: |
          g++ -std=c++17 -Wall -Wextra -Ilodestar -Inova nova/test/test_nova.cpp -o nova_test
          ./nova_test sample.json
          g++ -std=c++17 -Wall -Wextra -DNOVA_MPH=1 -Ilodestar -Inova nova/test/test_nova.cpp -o nova_test_mph
          ./nova_test_mph
          g++ -std=c++17 -Wall -Wextra -DNOVA_ORION=1 -Ilodestar -Inova nova/test/test_nova.cpp -o nova_test_orion
          ./nova_test_orion
          g++ -std=c++17 -Wall -Wextra -DNOVA_ORION=1 -DNOVA_MPH=1 -Ilodestar -Inova nova/test/test_nova.cpp -o nova_test_orion_mph
          ./nova_test_orion_mph

      - name: The dashboard line is real JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('sample.json'))
          assert d['nova'] == 1 and d['links'] and d['dl']['list'] and d['trip']['track']
          print('sample line OK,', len(open('sample.json').read()), 'bytes')
          "

  patch-check:
    name: Patch applies to current MeshCore, screens fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply NOVA
        run: python tools/apply_nova.py --meshcore MeshCore

      - name: Draw every screen on a pretend 128x64 display
        run: |
          mkdir -p inc/helpers
          cp nova/Nova.h lodestar/Lodestar.h inc/helpers/
          g++ -std=c++17 -Wall -Wextra -Iinc -Inova/ui -isystem MeshCore/src nova/test/test_ui.cpp -o ui_test
          ./ui_test
          g++ -std=c++17 -Wall -Wextra -DNOVA_ORION=1 -Iinc -Inova/ui -isystem MeshCore/src nova/test/test_ui.cpp -o ui_test_orion
          ./ui_test_orion

  build:
    name: Build firmware
    needs: [test, patch-check]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to publish a Release
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds, not after the build, if the release cannot be made.
      # This workflow only ever creates a NEW release.
      - name: Check the release tag (only when publishing)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPLACE: ${{ inputs.replace_files }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Publishing needs a release tag. Type a NEW one, for example v0.1.0-beta."
            exit 1
          fi
          # A release with this tag may already exist (made by hand, on the Releases page). If it has
          # no files yet, this run attaches the firmware to it. If it already has files, stop: this
          # workflow never replaces files unless the owner ticks replace_files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            N=$(gh release view "$TAG" --json assets --jq '.assets | length')
            if [ "$N" != "0" ] && [ "$REPLACE" = "true" ]; then
              echo "The release $TAG has $N file(s); replace_files is on, so this build's files will replace them."
            elif [ "$N" != "0" ]; then
              echo "::error::The release $TAG already has $N file(s). Choose a new tag; this workflow never overwrites a release."
              exit 1
            fi
            [ "$N" = "0" ] && echo "The release $TAG exists with no files: the firmware will be attached to it."
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Publishing from branch '$GITHUB_REF_NAME'. Releases should normally be made from main."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install platformio

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply NOVA
        run: python tools/apply_nova.py --meshcore MeshCore

      - name: Build firmware
        working-directory: MeshCore
        env:
          FW_ENV: ${{ inputs.env }}
          PLATFORMIO_BUILD_FLAGS: ${{ inputs.units == 'mph' && '-DNOVA_MPH=1' || '' }} ${{ inputs.edition == 'orion' && '-DNOVA_ORION=1' || '' }}
        run: |
          set -o pipefail
          case "$FW_ENV" in
            *nrf52*)
              # Nordic boards have no merged image: build, then make the .uf2 the board's bootloader reads
              pio run -e "$FW_ENV" 2>&1 | tee ../build.log
              python3 bin/uf2conv/uf2conv.py ".pio/build/$FW_ENV/firmware.hex" -c -o ".pio/build/$FW_ENV/firmware.uf2" -f 0xADA52840 2>&1 | tee -a ../build.log ;;
            *)
              pio run -t mergebin -e "$FW_ENV" 2>&1 | tee ../build.log ;;
          esac

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error|undefined reference|No such file" build.log | head -25 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Check the speed unit made it into the firmware
        env:
          FW_ENV: ${{ inputs.env }}
          UNITS: ${{ inputs.units }}
          EDITION: ${{ inputs.edition }}
        run: |
          BIN="MeshCore/.pio/build/$FW_ENV/firmware.elf"
          SFX=""; [ "$EDITION" = "orion" ] && SFX="-orion"
          if [ "$UNITS" = "mph" ]; then WANT="0.1.2-beta$SFX-mph"; else WANT="0.1.2-beta$SFX"; fi
          strings -n 8 "$BIN" | grep -F "$WANT" | head -3
          strings -n 8 "$BIN" | grep -q -x -F "$WANT" || { echo "::error::The version marker $WANT is missing from the build."; exit 1; }
          # the wrong variants must not be in there
          if [ "$UNITS" = "mph" ]; then WRONGU="0.1.2-beta$SFX"; else WRONGU="0.1.2-beta$SFX-mph"; fi
          if strings -n 8 "$BIN" | grep -q -x -F "$WRONGU"; then echo "::error::The build contains the other speed unit's marker ($WRONGU)."; exit 1; fi
          if [ "$EDITION" = "orion" ]; then OTHER="0.1.2-beta"; [ "$UNITS" = "mph" ] && OTHER="0.1.2-beta-mph"; else OTHER="0.1.2-beta-orion"; [ "$UNITS" = "mph" ] && OTHER="0.1.2-beta-orion-mph"; fi
          if strings -n 8 "$BIN" | grep -q -x -F "$OTHER"; then echo "::error::The build contains the other edition's marker ($OTHER)."; exit 1; fi

      - name: Collect files
        env:
          FW_ENV: ${{ inputs.env }}
        run: |
          mkdir out
          case "$FW_ENV" in
            *nrf52*)
              cp "MeshCore/.pio/build/$FW_ENV/firmware.uf2" out/
              cp "MeshCore/.pio/build/$FW_ENV/firmware.zip" out/ 2>/dev/null || true ;;
            *)
              cp "MeshCore/.pio/build/$FW_ENV/firmware-merged.bin" out/
              cp "MeshCore/.pio/build/$FW_ENV/firmware.bin" out/ ;;
          esac
          cp docs/index.html out/dashboard.html
          git -C MeshCore rev-parse HEAD > out/meshcore_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ inputs.env }}
          path: out/

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FW_ENV: ${{ inputs.env }}
          UNITS: ${{ inputs.units == 'mph' && 'mph' || 'km/h' }}
          EDITION: ${{ inputs.edition }}
        run: |
          if [ "$EDITION" = "orion" ]; then PRODUCT="LODESTAR ORION"; WHAT="wardriving edition of LODESTAR NOVA: it logs every repeater and companion it hears, with locations, for the dashboard map and CSV/GeoJSON/GPX downloads. It needs a GPS to place what it hears (the Heltec V4 with a GNSS module)"; else PRODUCT="LODESTAR NOVA"; WHAT="companion firmware"; fi
          MC=$(cut -c1-10 out/meshcore_commit.txt)
          case "$FW_ENV" in
            *nrf52*)
              BOARD="the Seeed Studio XIAO nRF52840 with the Wio-SX1262 kit (no screen: use the dashboard)"
              HOW="Double-tap the board's reset button so it appears as a USB drive, then drag firmware.uf2 onto it. firmware.zip is the same firmware as an update package for DFU tools."
              FILES="out/firmware.uf2 out/dashboard.html"; [ -f out/firmware.zip ] && FILES="$FILES out/firmware.zip" ;;
            *)
              BOARD="the Heltec WiFi LoRa 32 V4 R2 (ESP32-S3R2, OLED). Not for the V4-R8"
              HOW="Download firmware-merged.bin and flash it at https://flasher.meshcore.io (Custom Firmware). firmware.bin is the application-only image for updating an existing install."
              FILES="out/firmware-merged.bin out/firmware.bin out/dashboard.html" ;;
          esac
          NOTES="$PRODUCT $WHAT for $BOARD, by Wolf Reactive Systems (WRS). Beta test build ($FW_ENV, $UNITS speeds) on MeshCore commit $MC.

          $HOW dashboard.html is the browser dashboard, the same page as the repository's docs folder. See the README for setup and testing notes."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # attach to the release that is already there, leaving its title and notes as written
            gh release upload "$TAG" $FILES --clobber
            if [ "$UNITS" = "mph" ]; then gh release edit "$TAG" --notes "$NOTES"; fi
          else
            gh release create "$TAG" $FILES \
              --target "$GITHUB_SHA" --title "$PRODUCT $TAG" --notes "$NOTES" --prerelease
          fi
