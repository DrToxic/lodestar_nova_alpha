name: Build LODESTAR NOVA firmware

run-name: "${{ github.event_name == 'workflow_dispatch' && format('NOVA build: {0}', inputs.env) || 'NOVA checks' }}"

# Two kinds of run:
#   * every push and pull request: unit tests, screen-layout tests, and a check that the patch
#     still applies to the current MeshCore (about a minute, no firmware build)
#   * "Run workflow" by hand: the same checks, then the full firmware build (about 5 minutes)
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Firmware type. Bluetooth keeps the USB port free for the dashboard page"
        default: heltec_v4_companion_radio_ble
        required: true
        type: choice
        options:
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_usb
      publish:
        description: "Publish the result as a GitHub Release anyone can download"
        default: false
        required: false
        type: boolean
      release_tag:
        description: "Release tag. Required when publishing. A new tag makes a release; an existing release with no files gets the firmware attached"
        default: ""
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test NOVA
        run: |
          g++ -std=c++17 -Wall -Wextra -Ilodestar -Inova nova/test/test_nova.cpp -o nova_test
          ./nova_test sample.json

      - name: The dashboard line is real JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('sample.json'))
          assert d['nova'] == 1 and d['links'] and d['dl']['list'] and d['trip']['track']
          print('sample line OK,', len(open('sample.json').read()), 'bytes')
          "

  patch-check:
    name: Patch applies to current MeshCore, screens fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply NOVA
        run: python tools/apply_nova.py --meshcore MeshCore

      - name: Draw every screen on a pretend 128x64 display
        run: |
          mkdir -p inc/helpers
          cp nova/Nova.h lodestar/Lodestar.h inc/helpers/
          g++ -std=c++17 -Wall -Wextra -Iinc -Inova/ui -isystem MeshCore/src nova/test/test_ui.cpp -o ui_test
          ./ui_test

  build:
    name: Build firmware
    needs: [test, patch-check]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to publish a Release
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds, not after the build, if the release cannot be made.
      # This workflow only ever creates a NEW release.
      - name: Check the release tag (only when publishing)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Publishing needs a release tag. Type a NEW one, for example v0.1.0-alpha."
            exit 1
          fi
          # A release with this tag may already exist (made by hand, on the Releases page). If it has
          # no files yet, this run attaches the firmware to it. If it already has files, stop: this
          # workflow never replaces or deletes anything that is already published.
          if gh release view "$TAG" >/dev/null 2>&1; then
            N=$(gh release view "$TAG" --json assets --jq '.assets | length')
            if [ "$N" != "0" ]; then
              echo "::error::The release $TAG already has $N file(s). Choose a new tag; this workflow never overwrites a release."
              exit 1
            fi
            echo "The release $TAG exists with no files: the firmware will be attached to it."
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Publishing from branch '$GITHUB_REF_NAME'. Releases should normally be made from main."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install platformio

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply NOVA
        run: python tools/apply_nova.py --meshcore MeshCore

      - name: Build firmware
        working-directory: MeshCore
        env:
          FW_ENV: ${{ inputs.env }}
        run: |
          set -o pipefail
          pio run -t mergebin -e "$FW_ENV" 2>&1 | tee ../build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error|undefined reference|No such file" build.log | head -25 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Collect files
        env:
          FW_ENV: ${{ inputs.env }}
        run: |
          mkdir out
          cp "MeshCore/.pio/build/$FW_ENV/firmware-merged.bin" out/
          cp "MeshCore/.pio/build/$FW_ENV/firmware.bin" out/
          cp docs/index.html out/dashboard.html
          git -C MeshCore rev-parse HEAD > out/meshcore_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ inputs.env }}
          path: out/

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FW_ENV: ${{ inputs.env }}
        run: |
          MC=$(cut -c1-10 out/meshcore_commit.txt)
          NOTES="LODESTAR NOVA companion firmware for the Heltec WiFi LoRa 32 V4 R2 (ESP32-S3R2, OLED), by FEAR REACTIVE. Not for the V4-R8. Alpha test build ($FW_ENV) on MeshCore commit $MC.

          Download firmware-merged.bin and flash it at https://flasher.meshcore.io (Custom Firmware). firmware.bin is the application-only image for updating an existing install. dashboard.html is the browser dashboard, the same page as the repository's docs folder. See the README for setup and testing notes."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # attach to the release that is already there, leaving its title and notes as written
            gh release upload "$TAG" out/firmware-merged.bin out/firmware.bin out/dashboard.html
          else
            gh release create "$TAG" out/firmware-merged.bin out/firmware.bin out/dashboard.html \
              --target "$GITHUB_SHA" --title "LODESTAR NOVA $TAG" --notes "$NOTES" --prerelease
          fi
